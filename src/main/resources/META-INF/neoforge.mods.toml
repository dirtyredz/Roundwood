modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"
issueTrackerURL="https://github.com/dirtyredz/roundwood/issues"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
logoFile="roundwood-logo.png"
authors="${mod_authors}"
description='''${mod_description}'''

# The one mixin is client-only (listed under "client"); dedicated servers never apply it.
[[mixins]]
config="${mod_id}.mixins.json"

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="${neo_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

# Optional: recipe-viewer previews (client only; neither is bundled or required).
[[dependencies.${mod_id}]]
    modId="emi"
    type="optional"
    versionRange="[1.1.24,1.2)"
    ordering="NONE"
    side="CLIENT"

[[dependencies.${mod_id}]]
    modId="jei"
    type="optional"
    versionRange="[19.70.0,20)"
    ordering="NONE"
    side="CLIENT"
