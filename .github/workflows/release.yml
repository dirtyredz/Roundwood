name: Release
on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate tag, main ancestry and notes
        env:
          TAG: ${{ github.ref_name }}
        run: |
          git merge-base --is-ancestor HEAD refs/remotes/origin/main
          python3 - <<'PY'
          import os, pathlib
          props = dict(line.split('=', 1) for line in pathlib.Path('gradle.properties').read_text().splitlines()
                       if '=' in line and not line.lstrip().startswith('#'))
          version = props['mod_version'].strip()
          assert os.environ['TAG'] == 'v' + version, 'Tag must equal v<mod_version>'
          notes = pathlib.Path('docs/releases') / (version + '.md')
          assert notes.read_text().strip(), 'Release notes must be non-empty'
          PY
      - name: Refuse an existing release (including drafts)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          # Listing must succeed: authentication/network errors must not mean "absent".
          gh api --paginate "repos/$GH_REPO/releases?per_page=100" --jq '.[].tag_name' > release-tags.txt
          if grep -Fxq -- "$TAG" release-tags.txt; then
            echo "Release already exists for $TAG" >&2
            exit 1
          fi
      - uses: actions/setup-java@7a445ee88d4e23b52c33b10ccffbebb8a2e0e6c4 # v4.7.1
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@017a9effdb900e5b5b2fddfb590a105619dca3c3 # v4.4.2
        with:
          cache-read-only: true
      - name: Build and verify release jar
        timeout-minutes: 20
        run: |
          chmod +x gradlew
          ./gradlew test build verifyReleaseJar
      - name: Release GameTests
        timeout-minutes: 45
        shell: bash
        run: |
          if [[ "$(jq -er '.gametests | tostring' .ci/mod.json)" == true ]]; then
            set -o pipefail
            ./gradlew runGameTestServer --console=plain 2>&1 | tee gametest.log
            python3 - <<'PY'
          import pathlib, re
          log = pathlib.Path('gametest.log').read_text()
          counts = re.findall(r'All (\d+) required tests passed', log)
          assert counts and int(counts[-1]) > 0, 'No positive GameTest completion count'
          assert not re.search(r'\b[1-9]\d* (?:required|optional) tests failed', log), 'GameTests failed'
          PY
          fi
      - name: Upload GameTest logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: gametest-logs
          path: |
            gametest.log
            run/gametest/logs/
            run/gametest/crash-reports/
          if-no-files-found: ignore
          retention-days: 7
      - name: Prepare checksum and packwiz asset
        env:
          TAG: ${{ github.ref_name }}
          REPOSITORY: ${{ github.repository }}
          SERVER_URL: ${{ github.server_url }}
        run: |
          python3 - <<'PY'
          import hashlib, json, os, pathlib
          from urllib.parse import quote
          config = json.loads(pathlib.Path('.ci/mod.json').read_text())
          props = dict(line.split('=', 1) for line in pathlib.Path('gradle.properties').read_text().splitlines()
                       if '=' in line and not line.lstrip().startswith('#'))
          jars = list(pathlib.Path('build/ci/release').glob('*.jar'))
          assert len(jars) == 1, 'Expected exactly one verified release jar'
          jar = jars[0]
          digest = hashlib.sha256(jar.read_bytes()).hexdigest()
          jar.with_suffix('.jar.sha256').write_text(f'{digest}  {jar.name}\n')
          url = f"{os.environ['SERVER_URL']}/{os.environ['REPOSITORY']}/releases/download/{quote(os.environ['TAG'], safe='')}/{quote(jar.name, safe='')}"
          q = json.dumps
          text = (f'name = {q(props["mod_name"].strip())}\nfilename = {q(jar.name)}\n'
                  f'side = {q(config["packSide"])}\n\n[download]\nurl = {q(url)}\n'
                  f'hash-format = "sha256"\nhash = {q(digest)}\n')
          (jar.parent / (config['modId'] + '.pw.toml')).write_text(text)
          PY
      - name: Create draft prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          # gh release create fails if a release now exists; never use edit/upload --clobber.
          gh release create "$TAG" build/ci/release/* --verify-tag --draft --prerelease \
            --title "$TAG" --notes-file "docs/releases/${TAG#v}.md"
