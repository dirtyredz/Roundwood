name: Set up mod build
description: Shared Java and Gradle toolchain after checkout
runs:
  using: composite
  steps:
    - uses: actions/setup-java@7a445ee88d4e23b52c33b10ccffbebb8a2e0e6c4 # v4.7.1
      with:
        distribution: temurin
        java-version: '17'
    - uses: gradle/actions/setup-gradle@017a9effdb900e5b5b2fddfb590a105619dca3c3 # v4.4.2
      with:
        cache-read-only: ${{ github.ref != 'refs/heads/main' }}
