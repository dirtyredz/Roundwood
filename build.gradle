plugins {
    id 'java-library'
    id 'eclipse'
    id 'idea'
    id 'net.neoforged.moddev' version '2.0.148'
}

version = mod_version
group = mod_group_id

// Loader-qualified release name: <mod_id>-<minecraft>-neoforge-<mod_version>.jar
base {
    archivesName = "${mod_id}-${minecraft_version}-neoforge"
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

// Generated assets and data are checked in and packaged; the datagen cache is not.
sourceSets {
    main {
        resources {
            srcDir 'src/generated/resources'
            exclude '.cache/'
        }
    }
    // GameTests live in their own source set so they never reach the release jar.
    gameTest {
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
}

// Focused navigation stress runs compile only their fixtures and tests. No retries: every copy
// is a separate required test with the original 600-tick budget.
def navigationRepeats = providers.gradleProperty('navigationRepeats').map { it.toInteger() }.orElse(1).get()
if (project.hasProperty('navigationRepeats')) {
    if (navigationRepeats < 1 || navigationRepeats > 100) throw new GradleException('navigationRepeats must be 1..100')
    sourceSets.gameTest.java.include '**/fixture/**', '**/DoorNavigationGameTests.java',
            '**/TrimNavigationGameTests.java', '**/environment/**'
}

// Bounded fitted-door gate for 0.16.0; includes only the new showcase sections, not the full showcase suite.
if (project.hasProperty('doorTargets')) {
    sourceSets.gameTest.java.include '**/fixture/**', '**/DoorTargetsGameTests.java', '**/FramelessWindowGameTests.java', '**/DoorArchCamouflageGameTests.java', '**/DoorFeedbackUpgradeGameTests.java', '**/SurfaceFinishGameTests.java', '**/DoorHardwareGameTests.java', '**/HardwareShowcaseGameTests.java', '**/HardwareShowcaseChecks.java', '**/SectionChecks.java', '**/DoorAppearanceGameTests.java', '**/HeldTrimToolGameTests.java', '**/AnchorPersistenceGameTests.java', '**/ContentGameTests.java',
            '**/ArchPiecePlacementGameTests.java', '**/ArchPieceTrimGameTests.java', '**/ArchThinningGameTests.java',
            '**/DoorFreeEdgeGameTests.java', '**/ArchedDoorPlacementGameTests.java', '**/FittedShowcaseGameTests.java', '**/ShowcaseChecks.java', '**/ArchSectionsChecks.java', '**/DoorArchPersistenceGameTests.java', '**/DoorArchFittingGameTests.java', '**/DoorArchLifecycleGameTests.java', '**/AssemblyPlacementGameTests.java', '**/TestWorldGameTests.java'
}

// Focused full-showcase reproduction; all section checks share the showcase package.
if (project.hasProperty('renderingTargets')) {
    sourceSets.gameTest.java.include '**/fixture/**', '**/StaticRenderLifecycleGameTests.java', '**/AssemblyRenderNotificationsGameTests.java',
            '**/WindowTrimGameTests.java', '**/WindowSillGameTests.java', '**/WindowBeamGameTests.java',
            '**/WindowAppearanceGameTests.java', '**/TrimAppearanceGameTests.java',
            '**/AnchorPersistenceGameTests.java', '**/DoorArchPersistenceGameTests.java',
            '**/DoorArchFittingGameTests.java', '**/DoorArchLifecycleGameTests.java',
            '**/ArchPiecePlacementGameTests.java', '**/ArchPieceTrimGameTests.java', '**/TestWorldGameTests.java'
}

if (project.hasProperty('showcaseTargets')) {
    sourceSets.gameTest.java.include '**/fixture/**', '**/showcase/**', '**/TestWorldGameTests.java'
}

// Isolated reproduction selection for inspecting the occupied-cell witness.
if (project.hasProperty('archFitReproduction')) {
    sourceSets.gameTest.java.include '**/fixture/**', '**/DoorArchFittingGameTests.java', '**/TestWorldGameTests.java'
}

// Focused save-compatibility qualification: historical fixtures, registry contract and upgrade suites.
if (project.hasProperty('compatTargets')) {
    sourceSets.gameTest.java.include '**/fixture/**', '**/migration/**', '**/camouflage/**', '**/DoorUsePayloadGameTests.java',
            '**/TestWorldGameTests.java'
}

configurations {
    gameTestImplementation.extendsFrom implementation
    gameTestCompileOnly.extendsFrom compileOnly
    gameTestRuntimeOnly.extendsFrom runtimeOnly
}

// -PwithViewers=emi|jei|jei,emi puts the optional recipe viewers on the dev runtime (GameTests included).
// They are compile-only otherwise: the release jar never carries or requires them.
def runtimeViewers = (project.findProperty('withViewers') ?: '').toString().split(',').collect { it.trim() }.findAll { it }

neoForge {
    version = neo_version
    addModdingDependenciesTo(sourceSets.gameTest)

    runs {
        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.INFO
        }
        client {
            client()
        }
        server {
            server()
            programArgument '--nogui'
        }
        // GameTests are enabled only here; the other runs load the classes but never register tests.
        gameTestServer {
            type = 'gameTestServer'
            gameDirectory = project.file('run/gametest')
            systemProperty 'neoforge.enabledGameTestNamespaces', mod_id
            systemProperty 'roundwood.navigationRepeats', navigationRepeats.toString()
        }
        // Headless datagen: writes src/generated/resources, reading hand-made assets from src/main/resources.
        data {
            data()
            gameDirectory = project.file('run/data')
            programArguments.addAll '--mod', mod_id, '--all',
                    '--output', file('src/generated/resources/').absolutePath,
                    '--existing', file('src/main/resources/').absolutePath
        }
    }

    // One mod, two source sets: ModDevGradle groups both outputs under this mod id in development.
    // The release jar is built from sourceSets.main only.
    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
            sourceSet sourceSets.gameTest
        }
    }

    // Unit tests run under FML's JUnit launcher: registries, blocks and items are bootstrapped as in the game,
    // without a world or a server. Tests still read checked-in resources relative to the project directory.
    unitTest {
        enable()
        testedMod = mods."${mod_id}"
    }
}

repositories {
    maven {
        name = 'BlameJared (JEI)'
        url = 'https://maven.blamejared.com/'
        content { includeGroup 'mezz.jei' }
    }
    maven {
        name = 'Sleeping Town (EMI)'
        url = 'https://repo.sleeping.town/'
        content { includeGroup 'dev.emi' }
    }
    mavenCentral()
}

dependencies {
    // Optional recipe-viewer integrations, compile-only (pinned to the pack lock).
    compileOnly("mezz.jei:jei-${minecraft_version}-neoforge:${jei_version}") { transitive = false }
    compileOnly("dev.emi:emi-neoforge:${emi_version}") { transitive = false }
    if (runtimeViewers.contains('jei')) {
        runtimeOnly("mezz.jei:jei-${minecraft_version}-neoforge:${jei_version}") { transitive = false }
    }
    if (runtimeViewers.contains('emi')) {
        runtimeOnly("dev.emi:emi-neoforge:${emi_version}") { transitive = false }
    }

    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
    // FML's JUnit launcher writes config/, defaultconfigs/ and mods/ into its game directory (the working directory),
    // so it runs under build/. Tests read checked-in trees through testsupport/ProjectFiles.
    def junitRun = layout.buildDirectory.dir('moddev/junitRun').get().asFile
    workingDir = junitRun
    doFirst { junitRun.mkdirs() }
    systemProperty 'roundwood.projectDir', projectDir.absolutePath
    // The game bootstrap plus vanilla's data fixer (refund upgrade tests) exceed Gradle's default test heap.
    maxHeapSize = '3G'
}

// Optional compatibility check uses an existing local Sodium jar; never resolves or downloads a mod.
tasks.register('checkEmbeddium', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'io.github.dirtyredz.roundwood.testsupport.EmbeddiumClassLoad'
    doFirst {
        if (!project.hasProperty('embeddiumJar')) throw new GradleException('Supply -PembeddiumJar=<local jar>')
        args project.property('embeddiumJar')
    }
}

tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            minecraft_version      : minecraft_version, minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version, neo_version_range: neo_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id, mod_name: mod_name, mod_license: mod_license, mod_version: mod_version,
            mod_authors            : mod_authors, mod_description: mod_description,
    ]
    inputs.properties replaceProperties
    filesMatching(['META-INF/neoforge.mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}

tasks.named('jar', Jar).configure {
    from('LICENSE') { into 'META-INF' }
    // The client mixin is declared in neoforge.mods.toml ([[mixins]]), not the manifest.
    manifest {
        attributes([
                'Specification-Title'     : mod_id,
                'Specification-Vendor'    : mod_authors,
                'Specification-Version'   : '1',
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.jar.archiveVersion,
                'Implementation-Vendor'   : mod_authors,
        ])
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

// doFirst actions prepend: register world settings before cleanup so deletion executes first.
apply from: 'gradle/gametest-world.gradle'
apply from: 'gradle/verify-release-jar.gradle'

// Every GameTest run starts from a fresh world: the server saves its world under run/gametest, and
// item entities or villagers saved by an earlier run load into later tests' areas a few ticks in.
// Save-compatibility fixtures are compact SNBT on the GameTest classpath, never an imported world.
tasks.matching { it.name == 'runGameTestServer' }.configureEach {
    doFirst {
        delete file('run/gametest/world')
    }
}
