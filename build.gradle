plugins {
    id 'eclipse'
    id 'idea'
    id 'net.minecraftforge.gradle' version '6.0.54'
}

version = mod_version
group = mod_group_id

base {
    archivesName = "${mod_id}-${minecraft_version}"
}

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

// Generated assets and data are checked in and packaged; the datagen cache is not.
sourceSets {
    main {
        resources {
            srcDir 'src/generated/resources'
            exclude '.cache/'
        }
    }
    // GameTests live in their own source set so they never reach the release jar.
    gameTest {
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
}

// Focused navigation stress runs compile only their fixtures and tests. No retries: every copy
// is a separate required test with the original 600-tick budget.
def navigationRepeats = providers.gradleProperty('navigationRepeats').map { it.toInteger() }.orElse(1).get()
if (project.hasProperty('navigationRepeats')) {
    if (navigationRepeats < 1 || navigationRepeats > 100) throw new GradleException('navigationRepeats must be 1..100')
    sourceSets.gameTest.java.include '**/fixture/**', '**/DoorNavigationGameTests.java',
            '**/TrimNavigationGameTests.java', '**/environment/**'
}

// Bounded placement/lifecycle gate for 0.15.0; excludes navigation, showcase and migration suites.
if (project.hasProperty('doorTargets')) {
    sourceSets.gameTest.java.include '**/fixture/**', '**/DoorTargetsGameTests.java',
            '**/ArchPiecePlacementGameTests.java', '**/ArchPieceTrimGameTests.java', '**/ArchThinningGameTests.java',
            '**/DoorFreeEdgeGameTests.java', '**/DoorArchPersistenceGameTests.java', '**/DoorArchFittingGameTests.java', '**/DoorArchLifecycleGameTests.java', '**/AssemblyPlacementGameTests.java', '**/TestWorldGameTests.java'
}

// Explicit red witness while the fitted-door slices are still under construction.
if (project.hasProperty('archFitReproduction')) {
    sourceSets.gameTest.java.include '**/fixture/**', '**/DoorArchFittingGameTests.java', '**/TestWorldGameTests.java'
}

configurations {
    gameTestImplementation.extendsFrom implementation
    gameTestCompileOnly.extendsFrom compileOnly
    gameTestRuntimeOnly.extendsFrom runtimeOnly
}

// -PpackModsDir=<mods folder> puts the pack's door mods (Double Doors + Collective, Dramatic Doors)
// on the dev runtime so the GameTests can exercise them. Never part of a normal build.
def packModsDir = project.findProperty('packModsDir')?.toString()
// -PwithViewers=emi|jei|jei,emi puts the optional recipe viewers on the dev runtime (GameTests included).
// They are compile-only otherwise: the release jar never carries or requires them.
def runtimeViewers = (project.findProperty('withViewers') ?: '').toString().split(',').collect { it.trim() }.findAll { it }

minecraft {
    mappings channel: mapping_channel, version: mapping_version
    copyIdeResources = true

    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'info'
            if (packModsDir) {
                // The pack mods ship SRG refmaps; remap them for the dev environment.
                property 'mixin.env.remapRefMap', 'true'
                property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"
            }

            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }

        server {
            property 'forge.enabledGameTestNamespaces', mod_id
            args '--nogui'
        }

        gameTestServer {
            property 'roundwood.navigationRepeats', navigationRepeats.toString()
            workingDirectory project.file('run/gametest')
            property 'forge.enabledGameTestNamespaces', mod_id
            mods {
                "${mod_id}" {
                    source sourceSets.main
                    source sourceSets.gameTest
                }
            }
        }

        // Headless datagen: writes src/generated/resources, reading hand-made assets from src/main/resources.
        data {
            workingDirectory project.file('run/data')
            args '--mod', mod_id, '--all',
                    '--output', file('src/generated/resources/'),
                    '--existing', file('src/main/resources/')
        }
    }
}

repositories {
    if (packModsDir) {
        flatDir { dirs packModsDir }
    }
    maven {
        name = 'BlameJared (JEI)'
        url = 'https://maven.blamejared.com/'
        content { includeGroup 'mezz.jei'; includeGroup 'net.mezzdev.config' }
    }
    maven {
        name = 'TerraformersMC (EMI)'
        url = 'https://maven.terraformersmc.com/releases/'
        content { includeGroup 'dev.emi' }
    }
    mavenCentral()
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"

    if (packModsDir) {
        runtimeOnly fg.deobf('local:collective-1.20.1:8.40')
        runtimeOnly fg.deobf('local:doubledoors-1.20.1:7.2')
        runtimeOnly fg.deobf('local:DramaticDoors-Forge-1.20.1:2.3.7_1')
    }

    // Optional recipe-viewer integrations, compile-only (pinned to the workspace's versions).
    compileOnly(fg.deobf("mezz.jei:jei-${minecraft_version}-forge:${jei_version}")) { transitive = false }
    compileOnly(fg.deobf("dev.emi:emi-forge:${emi_version}")) { transitive = false }
    if (runtimeViewers.contains('jei')) {
        runtimeOnly(fg.deobf("mezz.jei:jei-${minecraft_version}-forge:${jei_version}")) { transitive = false }
    }
    if (runtimeViewers.contains('emi')) {
        runtimeOnly(fg.deobf("dev.emi:emi-forge:${emi_version}")) { transitive = false }
    }

    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
    // GeneratedResourcesTest reads the checked-in generated tree relative to the project.
    workingDir = projectDir
}

tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            minecraft_version      : minecraft_version, minecraft_version_range: minecraft_version_range,
            forge_version          : forge_version, forge_version_range: forge_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id, mod_name: mod_name, mod_license: mod_license, mod_version: mod_version,
            mod_authors            : mod_authors, mod_description: mod_description,
    ]
    inputs.properties replaceProperties
    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}

tasks.named('jar', Jar).configure {
    from('LICENSE') { into 'META-INF' }
    manifest {
        attributes([
                'Specification-Title'     : mod_id,
                'Specification-Vendor'    : mod_authors,
                'Specification-Version'   : '1',
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.jar.archiveVersion,
                'Implementation-Vendor'   : mod_authors,
        ])
    }
    finalizedBy 'reobfJar'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

// doFirst actions prepend: register world settings before cleanup so deletion executes first.
apply from: 'gradle/gametest-world.gradle'
apply from: 'gradle/verify-release-jar.gradle'

// Every GameTest run starts from a fresh world: the server saves its world under run/gametest, and
// item entities or villagers saved by an earlier run load into later tests' areas a few ticks in.
tasks.matching { it.name == 'runGameTestServer' }.configureEach {
    doFirst {
        delete file('run/gametest/world')
    }
}
